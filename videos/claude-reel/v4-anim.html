<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
const W=1280,H=720,DUR=29.6,FPS=30;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SERIF='Charter, "Bitstream Charter", "DejaVu Serif", serif';
const SANS='Inter, "Liberation Sans", sans-serif';
const MONO='"DejaVu Sans Mono","Liberation Mono",monospace';
const ACC='#e8825a',CREAM='#f3eee6',INK='#14110f',LIME='#d9f244',NAVY='#0e1224',WARM='#150c09';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eO=x=>1-Math.pow(1-x,3);
const eO5=x=>1-Math.pow(1-x,5);
const eBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
function hash(i,j){const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(s,x,y,font,col,align='left',a=1){ctx.globalAlpha=a;ctx.font=font;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);ctx.globalAlpha=1}
// text with directional motion blur (amount in px, along vy)
function blurText(s,x,y,font,col,align,vy,vx,a){
  const n=vy||vx?7:1;
  for(let i=0;i<n;i++){const k=n>1?(i/(n-1)-0.5):0;text(s,x+(vx||0)*k,y+(vy||0)*k,font,col,align,a*(n>1?(i===Math.floor(n/2)?0.9:0.22):1))}
}
const BOUNDS=[0,5,10,15,19.5,25,29.6];
const NAMES=['01 — SPARK','02 — CHAT','03 — TYPE','04 — MODELS','05 — BENCHMARK','06 — CREDIT'];
const LIGHT=[true,false,true,false,true,false]; // light backgrounds

// ---------- S1 SPARK (cream) ----------
function S1(t){
  ctx.fillStyle=CREAM;ctx.fillRect(0,0,W,H);
  // faint grid dots
  ctx.fillStyle='rgba(20,17,15,.12)';for(let x=40;x<W;x+=40)for(let y=40;y<H;y+=40)ctx.fillRect(x,y,2,2);
  const s=eBack(prog(t,0.2,1.3)),cx=W/2,cy=H/2-50;
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
  ctx.save();ctx.rotate(-0.3);ctx.strokeStyle=INK;ctx.lineWidth=1.6;ctx.beginPath();ctx.ellipse(0,0,230,80,0,0,6.283);ctx.stroke();
  const oa=t*0.9;ctx.fillStyle=ACC;ctx.beginPath();ctx.arc(Math.cos(oa)*230,Math.sin(oa)*80,9,0,6.283);ctx.fill();ctx.restore();
  ctx.rotate(t*0.5);
  for(let i=0;i<10;i++){const a=i/10*6.283,r=90+Math.sin(t*2+i)*10;
    ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(Math.cos(a)*18,Math.sin(a)*18);ctx.lineTo(Math.cos(a)*(r-14),Math.sin(a)*(r-14));ctx.stroke();
    ctx.fillStyle=INK;ctx.beginPath();ctx.arc(Math.cos(a)*r,Math.sin(a)*r,13,0,6.283);ctx.fill();}
  ctx.fillStyle=ACC;ctx.beginPath();ctx.arc(0,0,20,0,6.283);ctx.fill();
  ctx.restore();
  // kinetic title: letters drop in with blur
  const word='Claude';ctx.font='bold 120px '+SERIF;const tw=ctx.measureText(word).width;let x=W/2-tw/2;
  for(let i=0;i<word.length;i++){
    const w=ctx.measureText(word[i]).width,p=prog(t,2.0+i*0.09,2.7+i*0.09),e=eO5(p);
    if(p>0)blurText(word[i],x,lerp(250,590,e)+(1-e)*0,'bold 120px '+SERIF,INK,'left',(1-e)*140,0,clamp(p*4));
    x+=w;
  }
  text('CLAUDE — AN AI ASSISTANT, DRAWN IN CODE',W/2,640,'500 15px '+MONO,INK,'center',prog(t,3.2,3.8)*0.7);
}

// ---------- tilted card helper ----------
function tilt(cx,cy,rotY,fn){
  ctx.save();ctx.translate(cx,cy);ctx.transform(Math.cos(rotY),Math.sin(rotY)*0.10,0,1,0,0);fn();ctx.restore();
}
// ---------- S2 CHAT (dark) ----------
const PROMPT='Make a motion reel about Claude';
function S2(t){
  const g=ctx.createRadialGradient(W*.5,H*.5,50,W/2,H/2,W*.8);g.addColorStop(0,'#2a1812');g.addColorStop(1,'#0a0605');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const pan=Math.sin(t*0.6)*18,zoom=1+t*0.012;
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-W/2+pan,-H/2);
  // side cards
  const side=[{x:210,y:230,ry:0.55,k:'WRITE',lines:[.9,.7,.8,.5],d:0.4},{x:1070,y:230,ry:-0.55,k:'CODE',lines:[.6,.85,.4,.75],d:0.7},{x:230,y:500,ry:0.5,k:'ANALYZE',bars:true,d:1.0},{x:1060,y:500,ry:-0.5,k:'BUILD',lines:[.8,.5,.9,.6],d:1.3}];
  side.forEach(c=>{
    const p=eBack(prog(t,c.d,c.d+0.8));if(p<=0)return;
    tilt(c.x+(c.ry>0?-1:1)*(1-clamp(p))*200,c.y+Math.sin(t*1.3+c.d)*7,c.ry,()=>{
      ctx.globalAlpha=clamp(p);ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=30;rr(-130,-85,260,170,20);ctx.fillStyle='#241711';ctx.fill();ctx.shadowColor='transparent';
      ctx.strokeStyle='rgba(243,238,230,.14)';ctx.lineWidth=1.5;ctx.stroke();
      text(c.k,-104,-44,'600 15px '+MONO,ACC,'left');
      if(c.bars){[.5,.8,.35,.95].forEach((h,i)=>{ctx.fillStyle=i===3?ACC:'rgba(243,238,230,.5)';ctx.fillRect(-100+i*52,60-70*h*eO(prog(t,c.d+.5,c.d+1.3)),32,70*h*eO(prog(t,c.d+.5,c.d+1.3)))})}
      else c.lines.forEach((l,i)=>{ctx.fillStyle='rgba(243,238,230,.35)';rr(-104,-20+i*24,200*l,9,4);ctx.fill()});
      ctx.globalAlpha=1;
    });
  });
  // main chat card
  const inn=eO(prog(t,0.1,0.9)),cw=620,ch=300;
  ctx.save();ctx.globalAlpha=inn;ctx.translate(W/2,H/2+10+(1-inn)*60);ctx.scale(lerp(.92,1,inn),lerp(.92,1,inn));
  ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=50;ctx.shadowOffsetY=20;rr(-cw/2,-ch/2,cw,ch,24);ctx.fillStyle='#1d130f';ctx.fill();ctx.shadowColor='transparent';
  ctx.strokeStyle='rgba(243,238,230,.14)';ctx.lineWidth=1.5;ctx.stroke();
  ['#ff6159','#ffbd2e','#28c941'].forEach((c,i)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(-cw/2+30+i*20,-ch/2+28,6,0,6.283);ctx.fill()});
  text('Hi, Shin. What shall we create?',-cw/2+34,-ch/2+84,'500 26px '+SERIF,CREAM);
  rr(-cw/2+34,-ch/2+104,cw-68,62,16);ctx.fillStyle='#2a1c16';ctx.fill();ctx.strokeStyle='rgba(232,130,90,.5)';ctx.stroke();
  const n=Math.floor(prog(t,0.8,2.5)*PROMPT.length),caret=(Math.floor(t*2.5)%2===0&&t<3.0)?'|':'';
  text(PROMPT.slice(0,n)+caret,-cw/2+54,-ch/2+143,'400 20px '+SANS,CREAM);
  const pulse=t>2.6&&t<3.0?1+0.25*Math.sin((t-2.6)*15.7):1;ctx.fillStyle=ACC;ctx.beginPath();ctx.arc(cw/2-66,-ch/2+135,19*pulse,0,6.283);ctx.fill();
  ['Sure. Storyboard ready.','Scenes: Spark · Type · Models · Bench'].forEach((l,i)=>{const s=eO(prog(t,3.0+i*0.5,3.5+i*0.5));if(s>0)text(l,-cw/2+36,-ch/2+212+i*34+(1-s)*12,(i?'400 19px ':'500 21px ')+SANS,i?CREAM:ACC,'left',s)});
  ctx.restore();ctx.restore();
}

// ---------- S3 TYPE (lime) ----------
const WORDS=['WRITE','CODE','THINK','BUILD'];
function S3(t){
  ctx.fillStyle=LIME;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(20,17,15,.12)';ctx.lineWidth=1;for(let x=0;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  const seg=1.2;
  WORDS.forEach((w,i)=>{
    const s=0.1+i*seg,e=s+seg;if(t<s||t>e+0.05)return;
    const pin=prog(t,s,s+0.35),pout=prog(t,e-0.3,e);
    let y=H/2+95;let vy=0;
    if(pin<1){const k=eO5(pin);y+=(1-k)*420;vy=(1-k)*-180}
    if(pout>0){const k=eIO(pout);y-=k*420;vy=-k*180}
    blurText(w+(i===3?'.':'.'),W/2,y,'900 250px '+SANS,INK,'center',vy,0,1);
    // counter
    text('0'+(i+1)+' / 04',90,120,'600 18px '+MONO,INK,'left',0.8);
  });
  const bw=prog(t,0,4.9)*(W-180);ctx.fillStyle=INK;ctx.fillRect(90,H-120,bw,6);
}

// ---------- S4 MODELS (truchet black) ----------
function truchet(t){
  ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);
  const c=84;ctx.strokeStyle='#f3eee6';ctx.lineWidth=13;ctx.lineCap='butt';
  const ox=-(t*20)%c;
  for(let i=-1;i<17;i++)for(let j=0;j<10;j++){
    const h=hash(i+Math.floor(-ox*0+0),j),ph=t*0.45+h*4,k=Math.floor(ph),f=ph-k;
    const ang=(h>0.5?1:0)*Math.PI/2+k*Math.PI/2+eIO(clamp(f*2.2))*Math.PI/2;
    ctx.save();ctx.translate(i*c+c/2+ox,j*c+c/2+ (H-10*c)/2);ctx.rotate(ang);
    ctx.beginPath();ctx.arc(-c/2,-c/2,c/2,0,Math.PI/2);ctx.stroke();
    ctx.beginPath();ctx.arc(c/2,c/2,c/2,Math.PI,Math.PI*1.5);ctx.stroke();ctx.restore();
  }
}
function S4(t){
  truchet(t);
  ctx.fillStyle='rgba(5,5,5,.55)';ctx.fillRect(0,0,W,H);
  text('MEET THE MODELS',W/2,112,'600 20px '+MONO,CREAM,'center',eO(prog(t,0.1,0.6)));
  [{n:'Sonnet 5.5',d:-1,tag:'EVERYDAY WORK'},{n:'Opus 5.5',d:1,tag:'THE FLAGSHIP'}].forEach((m,i)=>{
    const s=0.3+i*0.5,p=eBack(prog(t,s,s+0.8));if(p<=0)return;
    const cw=420,ch=290,cx=W/2+m.d*250,cy=H/2+20+Math.sin(t*1.5+i*2)*8;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(m.d*0.05*(1-clamp(p))+m.d*0.02);ctx.scale(clamp(p,0,1.1),clamp(p,0,1.1));
    ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=50;rr(-cw/2,-ch/2,cw,ch,26);ctx.fillStyle=i?ACC:CREAM;ctx.fill();ctx.shadowColor='transparent';
    for(let k=0;k<8;k++){const a=k/8*6.283+t*(i?-1:1);ctx.fillStyle=INK;ctx.beginPath();ctx.arc(Math.cos(a)*24,-76+Math.sin(a)*24,5,0,6.283);ctx.fill()}
    text('CLAUDE',0,-20,'600 15px '+MONO,INK,'center',0.7);
    const nm=m.n;ctx.font='bold 66px '+SERIF;const tw=ctx.measureText(nm).width;let x=-tw/2;
    for(let k=0;k<nm.length;k++){const w=ctx.measureText(nm[k]).width,a=eO5(prog(t,s+0.5+k*0.05,s+0.9+k*0.05));
      if(a>0)blurText(nm[k],x,62+(1-a)*40,'bold 66px '+SERIF,INK,'left',(1-a)*60,0,clamp(a*3));x+=w}
    text(m.tag,0,108,'600 14px '+MONO,INK,'center',0.75);
    ctx.restore();
  });
}

// ---------- S5 BENCHMARK (cream, chart) ----------
const STATS=[{n:'SWE-BENCH PRO',o:89.9,s:81.3},{n:'SWE-BENCH MULTILINGUAL',o:93.9,s:90.3},{n:'SWE-BENCH MULTIMODAL',o:61.4,s:54.3}];
function S5(t){
  ctx.fillStyle=CREAM;ctx.fillRect(0,0,W,H);
  const p0=eO(prog(t,0.1,0.8));
  blurText('Where Opus 5.5 leads.',90,160+(1-p0)*40,'italic 58px '+SERIF,INK,'left',(1-p0)*50,0,p0);
  text('VENDOR-REPORTED VIA THIRD-PARTY SUMMARIES · VERIFY WITH ANTHROPIC SYSTEM CARD',90,196,'500 12px '+MONO,INK,'left',0.55*p0);
  // legend
  ctx.fillStyle=ACC;ctx.beginPath();ctx.arc(1010,150,8,0,6.283);ctx.fill();text('OPUS 5.5',1026,156,'600 14px '+MONO,INK,'left',p0);
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(1010,178,8,0,6.283);ctx.fill();text('SONNET 5.5',1026,184,'600 14px '+MONO,INK,'left',p0);
  const bx=90,bw=1000,bh=26;
  STATS.forEach((r,i)=>{
    const y=260+i*125,s0=0.8+i*0.5;
    text(r.n,bx,y,'600 15px '+MONO,INK,'left',eO(prog(t,s0-0.2,s0+0.3)));
    [['o',ACC,y+14],['s',INK,y+14+bh+8]].forEach(([k,c,by],j)=>{
      const v=r[k],p=eO5(prog(t,s0+j*0.15,s0+1.1+j*0.15));
      ctx.fillStyle='rgba(20,17,15,.08)';rr(bx,by,bw,bh,6);ctx.fill();
      if(p>0){ctx.fillStyle=c;rr(bx,by,Math.max(8,bw*v/100*p),bh,6);ctx.fill()}
      text((v*p).toFixed(1),bx+bw+16,by+bh-6,(k==='o'?'bold ':'500 ')+'20px '+MONO,INK,'left',clamp(p*2));
    });
  });
}

// ---------- S6 CREDIT (navy) ----------
function S6(t){
  const g=ctx.createRadialGradient(W/2,H/2,40,W/2,H/2,W*.7);g.addColorStop(0,'#1a2142');g.addColorStop(1,NAVY);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  text('MADE BY',W/2,H/2-90,'600 20px '+MONO,ACC,'center',eO(prog(t,0.2,0.8)));
  const name='Shin Thant';ctx.font='bold 150px '+SERIF;const tw=ctx.measureText(name).width;let x=W/2-tw/2;
  for(let i=0;i<name.length;i++){
    const w=ctx.measureText(name[i]).width,p=prog(t,0.4+i*0.07,1.1+i*0.07),e=eO5(p),dir=i%2?1:-1;
    if(p>0)blurText(name[i],x+(1-e)*dir*300,H/2+50,'bold 150px '+SERIF,CREAM,'left',0,(1-e)*dir*-120,clamp(p*3));
    x+=w;
  }
  const u=eO(prog(t,1.6,2.3));ctx.fillStyle=ACC;ctx.fillRect(W/2-140*u,H/2+85,280*u,6);
  text('Unofficial fan-made video. Claude is a product of Anthropic.',W/2,H-76,'400 16px '+SANS,CREAM,'center',prog(t,1.8,2.4)*0.6);
}
const SCENES=[S1,S2,S3,S4,S5,S6];

// ---------- HUD ----------
function hud(t,si){
  const c=LIGHT[si]?'rgba(20,17,15,.8)':'rgba(243,238,230,.8)';
  ctx.strokeStyle=c;ctx.lineWidth=2;const m=24,L=20;
  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,sx,sy])=>{ctx.beginPath();ctx.moveTo(x,y+sy*L);ctx.lineTo(x,y);ctx.lineTo(x+sx*L,y);ctx.stroke()});
  text("SHIN THANT  /  CLAUDE REEL 2026",m+14,m+22,'500 11px '+MONO,c,'left');
  const f=Math.floor(t*FPS),tc=[Math.floor(f/FPS/60),Math.floor(f/FPS)%60,f%FPS].map(v=>String(v).padStart(2,'0')).join(':');
  text('TC 00:'+tc,W-m-14,m+22,'500 11px '+MONO,c,'right');
  text(NAMES[si],m+14,H-m-14,'500 11px '+MONO,c,'left');
  text('1280×720 · 30 FPS',W-m-14,H-m-14,'500 11px '+MONO,c,'right');
}

// ---------- transitions: stair wipe ----------
function stairs(t){
  const N=8,bh=H/N;
  for(let bI=1;bI<BOUNDS.length-1;bI++){
    const b=BOUNDS[bI];
    if(t>b-0.32&&t<b+0.32){
      for(let i=0;i<N;i++){
        let w;
        if(t<b){w=W*eIO(clamp((t-(b-0.32)-i*0.02)/0.22))}
        else{w=W*(1-eIO(clamp((t-b-i*0.02)/0.22)))}
        ctx.fillStyle='#050505';
        if(t<b)ctx.fillRect(0,i*bh,w,bh+1);else ctx.fillRect(W-w,i*bh,w,bh+1);
      }
    }
  }
}

window.draw=function(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  let si=0;for(let i=0;i<BOUNDS.length-1;i++)if(t>=BOUNDS[i])si=i;
  SCENES[si](t-BOUNDS[si]);
  hud(t,si);
  stairs(t);
};
window.DUR=DUR;
draw(0);
</script></body></html>
