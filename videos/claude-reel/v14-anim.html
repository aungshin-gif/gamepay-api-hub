<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
const W=1280,H=720,DUR=23,FPS=60;
const cv=document.getElementById('c'),ctxMain=cv.getContext('2d');let ctx=ctxMain;
const cA=document.createElement('canvas');cA.width=W;cA.height=H;const xA=cA.getContext('2d');
const cB=document.createElement('canvas');cB.width=W;cB.height=H;const xB=cB.getContext('2d');
const QP=new URLSearchParams(location.search);const WM=QP.get('wm')!=='0',SAMPLE=QP.get('sample')!=='0'; // ?wm=0 hides the small name mark
const SERIF='Charter, "Bitstream Charter", "DejaVu Serif", serif';
const SANS='Inter, "Liberation Sans", sans-serif';
const MONO='"DejaVu Sans Mono","Liberation Mono",monospace';
const ACC='#e8825a',CREAM='#f3eee6',INK='#14110f';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eO=x=>1-Math.pow(1-x,3);
const eO5=x=>1-Math.pow(1-x,5);
const eBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(s,x,y,font,col,align='left',a=1){ctx.globalAlpha=a;ctx.font=font;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);ctx.globalAlpha=1}
function blurText(s,x,y,font,col,align,vy,vx,a){const n=vy||vx?7:1;for(let i=0;i<n;i++){const k=n>1?(i/(n-1)-0.5):0;text(s,x+(vx||0)*k,y+(vy||0)*k,font,col,align,a*(n>1?(i===Math.floor(n/2)?0.9:0.22):1))}}
function kinetic(word,cx,y,font,col,t,t0,stagger,drop){
  ctx.font=font;const tw=ctx.measureText(word).width;let x=cx-tw/2;
  for(let i=0;i<word.length;i++){const w=ctx.measureText(word[i]).width,p=prog(t,t0+i*stagger,t0+0.6+i*stagger),e=eO5(p);
    if(p>0)blurText(word[i],x,y-(1-e)*drop,font,col,'left',(1-e)*drop*0.5,0,clamp(p*4));x+=w}
}

// ---------- Higgsfield 3D assets (loaded before rendering) ----------
const IMGS={},BENCH=[],BN=151;
function loadImg(src){return new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src})}
window.ready=(async()=>{IMGS.pet=await loadImg('hf/pet_cut.png');IMGS.cc=await loadImg('hf/spark.png');IMGS.sp=IMGS.cc;IMGS.avatar=await loadImg('hf/avatar.jpg');for(const k of ['profile_l','profile_d','chat_glass','menu_glass'])IMGS[k]=await loadImg('hf/'+k+'.png');IMGS.b_env=await loadImg('hf/bench_env.png');for(const k of ['intro','code','code2','think','reason','card','chat','close','seal'])IMGS['b_'+k]=await loadImg('hf/'+(k==='seal'?'seal':k)+'.png');IMGS.bg=await loadImg('hf/bg3d.png');
  for(let i=1;i<=BN;i++)BENCH.push(await loadImg('hf/bench/b_'+String(i).padStart(4,'0')+'.jpg'))})();

// ---------- colour that never stays fixed ----------
const hsl=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`;

// ---------- code-drawn 3D-style pet (fallback until Higgsfield image can be loaded) ----------
function petCode(x,y,s,dir,t,walk){
  ctx.save();ctx.translate(x,y);ctx.scale(dir*s,s);
  const ph=t*9*walk,bob=Math.abs(Math.sin(ph))*-7*walk,sway=Math.sin(ph)*0.06*walk;
  // shadow
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,2,46,9,0,0,6.283);ctx.fill();
  ctx.translate(0,bob);ctx.rotate(sway);
  // legs (alternating)
  ctx.strokeStyle='#b4573a';ctx.lineWidth=6;ctx.lineCap='round';
  for(let i=0;i<4;i++){const lx=-26+i*17,up=Math.max(0,Math.sin(ph+i*1.6))*walk*9;
    ctx.beginPath();ctx.moveTo(lx,-14);ctx.lineTo(lx+(i%2?4:-4),-2-up);ctx.stroke()}
  // far claw
  claw(30,-44,-0.5,t,0.6);
  // body
  const g=ctx.createRadialGradient(-12,-52,6,0,-38,50);g.addColorStop(0,'#ffb08a');g.addColorStop(.5,ACC);g.addColorStop(1,'#a84d33');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,-34,42,32,0,0,6.283);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-14,-48,14,7,-0.5,0,6.283);ctx.fill();
  // eyes
  const bl=(Math.floor(t*1.3)%4===0&&(t*1.3%1)<0.12)?0.15:1;
  [[8,-62],[24,-60]].forEach(([ex,ey])=>{ctx.strokeStyle='#b4573a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(ex,ey+10);ctx.lineTo(ex,ey+2);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex,ey,7,7*bl,0,0,6.283);ctx.fill();ctx.fillStyle=INK;ctx.beginPath();ctx.ellipse(ex+2,ey,3.2,3.2*bl,0,0,6.283);ctx.fill()});
  // near claw
  claw(-34,-44,0.5,t,1);
  ctx.restore();
}

function pet(x,y,s,dir,t,walk){
  const im=IMGS.pet;if(!im){return petCode(x,y,s,dir,t,walk)}
  const ph=t*9*walk,bob=Math.abs(Math.sin(ph))*-9*walk,sway=Math.sin(ph)*0.07*walk,sq=1+Math.abs(Math.sin(ph))*0.045*walk;
  const h=118*s,w=h*im.width/im.height;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.ellipse(0,2,w*0.36,8,0,0,6.283);ctx.fill();
  ctx.translate(0,bob);ctx.rotate(sway*dir);ctx.scale(dir,sq);
  ctx.drawImage(im,-w/2,-h,w,h);ctx.restore();
}
function claw(x,y,rot,t,sc){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.rotate(rot+Math.sin(t*5)*0.08);
  ctx.strokeStyle='#cf6c4a';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-22);ctx.stroke();
  const open=0.25+Math.abs(Math.sin(t*3.2))*0.45;
  [[-1,'#e8825a'],[1,'#ff9a72']].forEach(([d,c])=>{ctx.save();ctx.translate(0,-22);ctx.rotate(d*open);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(d*20,-12,d*5,-34);ctx.quadraticCurveTo(-d*3,-18,0,0);ctx.fill();ctx.restore()});
  ctx.restore();
}


function bgImg(im,t,dur,z0,z1,dx,dy,dim){
  if(!im){ctx.fillStyle='#0b0706';ctx.fillRect(0,0,W,H);return}
  const k=clamp(t/dur),s=Math.max(W/im.width,H/im.height)*lerp(z0,z1,eIO(k));
  ctx.save();ctx.translate(W/2+dx*k,H/2+dy*k);ctx.scale(s,s);ctx.drawImage(im,-im.width/2,-im.height/2);ctx.restore();
  if(dim){ctx.fillStyle='rgba(8,6,10,'+dim+')';ctx.fillRect(0,0,W,H)}
}

// ---------- S1 INTRO ----------
const cL=document.createElement('canvas');cL.width=640;cL.height=640;const xL=cL.getContext('2d');
function orb(x,y,r,a){ // small glass sphere
  ctx.save();ctx.globalAlpha=a;
  const g=ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.05,x,y,r);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.35,'rgba(255,214,190,.55)');g.addColorStop(1,'rgba(232,130,90,.18)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=1.2;ctx.stroke();ctx.restore();
}
function ringHalf(rx,ry,rot,back,a){ctx.save();ctx.rotate(rot);ctx.strokeStyle='rgba(120,70,50,'+a+')';ctx.lineWidth=1.6;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,back?Math.PI:0,back?Math.PI*2:Math.PI);ctx.stroke();ctx.restore()}
function S1(t){
  bgImg(IMGS.b_intro,t,3.2,1.02,1.1,-26,10,0);
  const cx=W/2,cy=H/2-62,k=prog(t,0.15,1.35),e=eO5(k),ap=clamp(k*2.5);
  const RX=250,RY=84,RT=-0.28,sz=300;
  // floating dust
  for(let i=0;i<26;i++){const px=(i*167%W)+Math.sin(t*0.6+i)*18,py=((i*97+t*(8+i%5*3))%H),r=1+(i%3);ctx.fillStyle='rgba(255,236,220,'+(0.25+0.2*Math.sin(t+i))+')';ctx.beginPath();ctx.arc(px,py,r,0,6.283);ctx.fill()}
  // soft contact shadow on the floor, breathing with the float
  const fy=Math.sin(t*1.3)*7*e,sh=0.5+0.5*(1-Math.sin(t*1.3))*0.5;
  ctx.fillStyle='rgba(90,48,30,'+(0.22*ap*sh)+')';ctx.beginPath();ctx.ellipse(cx,cy+sz*0.62,sz*0.40*(0.8+0.2*e),16,0,0,6.283);ctx.fill();
  ctx.save();ctx.translate(cx,cy);
  // back half of the 3D ring + orbs that are behind the logo
  ctx.globalAlpha=ap;ringHalf(RX,RY,RT,true,0.42);ctx.globalAlpha=1;
  const orbs=[0,2.1,4.2];
  orbs.forEach((o,i)=>{const a=t*0.95+o,dep=Math.sin(a);if(dep<0){const x0=Math.cos(a)*RX,y0=dep*RY,xr=x0*Math.cos(RT)-y0*Math.sin(RT),yr=x0*Math.sin(RT)+y0*Math.cos(RT);orb(xr,yr,19+i*5+dep*6,ap*0.9)}});
  ctx.restore();
  // the 3D logo: flips in around its vertical axis, then floats and sways
  const im=IMGS.sp;
  if(im&&ap>0){
    const rotY=(1-e)*1.45+Math.sin(t*0.9)*0.12*e,rotZ=(1-e)*-0.55+Math.sin(t*0.7)*0.045,sc=lerp(0.5,1,eBack(clamp(k)))*(1+Math.sin(t*1.5)*0.012);
    xL.clearRect(0,0,640,640);xL.globalCompositeOperation='source-over';xL.drawImage(im,0,0,640,640);
    const sw=prog(t,0.95,1.75),sw2=prog((t+1.4)%2.6,0.0,0.6); // sheen sweeps across the glaze
    xL.globalCompositeOperation='source-atop';
    [sw,(t>1.8?sw2:0)].forEach((p,j)=>{if(p>0&&p<1){const gx=lerp(-200,840,p),g=xL.createLinearGradient(gx-110,0,gx+110,640);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,'+(j?0.28:0.42)+')');g.addColorStop(1,'rgba(255,255,255,0)');xL.fillStyle=g;xL.fillRect(0,0,640,640)}});
    xL.globalCompositeOperation='source-over';
    ctx.save();ctx.globalAlpha=ap;ctx.translate(cx,cy+fy);ctx.rotate(rotZ);ctx.transform(Math.cos(rotY),0,Math.sin(rotY)*0.16,1,0,0);ctx.scale(sc,sc);
    ctx.shadowColor='rgba(120,60,30,.35)';ctx.shadowBlur=36;ctx.shadowOffsetY=18;ctx.drawImage(cL,-sz/2,-sz/2,sz,sz);ctx.restore();
  }
  // front half of the ring + orbs passing in front
  ctx.save();ctx.translate(cx,cy);ctx.globalAlpha=ap;ringHalf(RX,RY,RT,false,0.65);ctx.globalAlpha=1;
  orbs.forEach((o,i)=>{const a=t*0.95+o,dep=Math.sin(a);if(dep>=0){const x0=Math.cos(a)*RX,y0=dep*RY,xr=x0*Math.cos(RT)-y0*Math.sin(RT),yr=x0*Math.sin(RT)+y0*Math.cos(RT);orb(xr,yr,19+i*5+dep*7,ap)}});
  ctx.restore();
  kinetic('Claude',W/2,596,'bold 118px '+SERIF,INK,t,1.2,0.08,320);
}

// ---------- S2 CLAUDE CODE (3D scene, colours always drifting) ----------
function codeBGold(t){
  const h=10+Math.sin(t*0.9)*32; // drifting warm hue (red-orange-amber)
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,hsl(h+200,45,8));g.addColorStop(.55,hsl(h+10,55,13));g.addColorStop(1,hsl(h,60,6));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // glow orbs
  for(let i=0;i<3;i++){const x=W*(.2+.3*i)+Math.sin(t*.7+i*2)*120,y=H*(.3+.1*Math.cos(t*.5+i))+0;const r=ctx.createRadialGradient(x,y,0,x,y,320);r.addColorStop(0,hsl(h+i*50,80,55,.30));r.addColorStop(1,hsl(h+i*50,80,55,0));ctx.fillStyle=r;ctx.fillRect(0,0,W,H)}
  // perspective floor grid
  const hz=H*0.52,vx=W/2+Math.sin(t*.4)*60;
  ctx.strokeStyle=hsl(h+20,85,62,.35);ctx.lineWidth=1.5;
  for(let i=-14;i<=14;i++){ctx.beginPath();ctx.moveTo(vx+i*26,hz);ctx.lineTo(vx+i*190,H);ctx.stroke()}
  for(let k=0;k<12;k++){const f=((k+t*1.4)%12)/12,y=hz+Math.pow(f,2.2)*(H-hz);ctx.globalAlpha=f;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();ctx.globalAlpha=1}
  // floating glass panels with parallax
  for(let i=0;i<7;i++){const dz=0.4+(i%4)*0.25,px=((i*211+t*30*dz)%(W+300))-150,py=120+((i*97)%240)+Math.sin(t*1.1+i)*14;
    ctx.save();ctx.translate(px,py);ctx.transform(1,0.05*Math.sin(t+i),-0.2,1,0,0);ctx.globalAlpha=0.25*dz+0.1;rr(-60*dz,-36*dz,120*dz,72*dz,10);ctx.fillStyle=hsl(h+30*i,60,70,.18);ctx.fill();ctx.strokeStyle=hsl(h+30*i,80,75,.5);ctx.lineWidth=1.2;ctx.stroke();ctx.restore();ctx.globalAlpha=1}
}

function codeBG(t){
  bgImg(IMGS.b_code2,t,3.6,1.04,1.18,-34,-8,0.10);
  const g=ctx.createRadialGradient(W/2,H*0.42,40,W/2,H*0.42,520);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(4,2,12,.45)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function S2(t){
  codeBG(t);
  kinetic('Claude Code',W/2+34,118,'bold 72px '+SERIF,CREAM,t,0.1,0.05,130);
  if(IMGS.cc){const ip=eBack(prog(t,0.15,0.8)),sz=74*clamp(ip,0,1.1),fy=Math.sin(t*2.2)*3;ctx.save();ctx.globalAlpha=clamp(ip*2);ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=18;ctx.shadowOffsetY=6;ctx.drawImage(IMGS.cc,W/2-300-sz/2+34,118-26-sz/2+fy,sz,sz);ctx.restore()}
  // terminal window
  const inn=eO(prog(t,0.3,1.1)),wx=W/2-380,wy=250+Math.sin(t*1.2)*5+(1-inn)*80,ww=760,wh=330;
  ctx.save();ctx.globalAlpha=inn;ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=50;ctx.shadowOffsetY=24;
  rr(wx,wy,ww,wh,18);ctx.fillStyle='rgba(18,12,10,.92)';ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle='rgba(243,238,230,.16)';ctx.lineWidth=1.5;ctx.stroke();
  ['#ff6159','#ffbd2e','#28c941'].forEach((c,i)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(wx+26+i*20,wy+24,6,0,6.283);ctx.fill()});
  text('claude-code',wx+ww/2,wy+29,'500 14px '+MONO,CREAM,'center',0.6);
  const F='500 19px '+MONO,lh=34,x0=wx+30;let y0=wy+82;
  const cmd='Build me a landing page';const n=Math.floor(prog(t,1.2,2.6)*cmd.length);
  text('> claude',x0,y0,F,CREAM,'left',eO(prog(t,0.7,1.0)));
  text('* Welcome to Claude Code',x0,y0+lh,F,ACC,'left',eO(prog(t,1.0,1.3)));
  text('> '+cmd.slice(0,n)+((Math.floor(t*3)%2===0&&t<3.0)?'_':''),x0,y0+lh*2,F,CREAM,'left',eO(prog(t,1.1,1.4)));
  [['● Reading project files...',3.0],['● Writing index.html, styles.css',3.5],['v Done. Preview is ready.',4.1]].forEach(([l,s],i)=>{const a=eO(prog(t,s,s+0.35));if(a>0)text(l,x0,y0+lh*(3+i)+(1-a)*10,F,i===2?'#7ddc8a':CREAM,'left',a)});
  ctx.restore();
  // pet walks on top edge of window
  const pp=prog(t,0.9,4.7),px=lerp(wx+60,wx+ww-60,eIO(pp)),dir=1;
  const walking=pp>0&&pp<1?1:0;
  if(t>0.9)pet(px,wy-4,0.82,dir,t,walking);
  text('this little claw is code-drawn for now',W/2,H-60,'400 14px '+MONO,CREAM,'center',0.0);
}

// ---------- S3 THINKING (living background) ----------
function stepDots(cx,y,t,col){for(let i=0;i<3;i++){const a=0.25+0.75*Math.max(0,Math.sin(t*5-i*0.9));ctx.fillStyle=col;ctx.globalAlpha=a;ctx.beginPath();ctx.arc(cx-22+i*22,y,5,0,6.283);ctx.fill()}ctx.globalAlpha=1}
function S3(t){ // THINKING: neural sculpture
  bgImg(IMGS.b_think,t,2.8,1.12,1.0,40,10,0);
  const sc=ctx.createLinearGradient(0,0,W*0.66,0);sc.addColorStop(0,'rgba(8,3,18,.8)');sc.addColorStop(1,'rgba(8,3,18,0)');ctx.fillStyle=sc;ctx.fillRect(0,0,W*0.66,H);
  const cx=W*0.29;
  text('01 / 02',cx,H/2-96,'600 15px '+MONO,CREAM,'center',0.7*eO(prog(t,0.1,0.5)));
  kinetic('Thinking',cx,H/2+8,'bold 86px '+SERIF,CREAM,t,0.15,0.05,150);
  stepDots(cx,H/2+58,t,CREAM);
}
const REASON=['Read the question','Weigh the options','Check the answer'];
function S3b(t){ // REASONING: stacked glass layers of a large model
  bgImg(IMGS.b_reason,t,2.8,1.05,1.16,-30,-6,0);
  const sc=ctx.createLinearGradient(0,0,W*0.6,0);sc.addColorStop(0,'rgba(2,6,16,.78)');sc.addColorStop(1,'rgba(2,6,16,0)');ctx.fillStyle=sc;ctx.fillRect(0,0,W*0.6,H);
  const x0=W*0.08;
  text('02 / 02',x0,H/2-100,'600 15px '+MONO,CREAM,'left',0.7*eO(prog(t,0.1,0.5)));
  kinetic('Reasoning',x0+226,H/2-6,'bold 80px '+SERIF,CREAM,t,0.15,0.05,150);
  REASON.forEach((l,i)=>{const a=eO(prog(t,0.9+i*0.4,1.3+i*0.4)),y=H/2+48+i*34;
    ctx.globalAlpha=a;ctx.strokeStyle='#ffc57a';ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(x0+10,y-6,10,0,6.283);ctx.stroke();ctx.beginPath();ctx.moveTo(x0+5,y-6);ctx.lineTo(x0+9,y-2);ctx.lineTo(x0+16,y-11);ctx.stroke();ctx.globalAlpha=1;
    text(l,x0+32,y+(1-a)*8,'500 19px '+SANS,CREAM,'left',a)});
}

// ================= CHAT + MODEL PICKER (Higgsfield dark glass UI) =================
const GBB={"chat_glass": [130, 75, 1084, 574, 1344, 752], "menu_glass": [176, 91, 816, 687, 1168, 880]};
function gAsset(key,cx,cy,sc,fn,alpha){const im=IMGS[key],b=GBB[key];if(!im||!b)return;ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(-(b[0]+b[2]/2),-(b[1]+b[3]/2));ctx.drawImage(im,0,0);if(fn)fn();ctx.restore()}
function gPt(key,cx,cy,sc,x,y){const b=GBB[key];return [cx+(x-(b[0]+b[2]/2))*sc,cy+(y-(b[1]+b[3]/2))*sc]}
const MODELS2=[{n:'Sonnet 5.5',c:'#62d2ff'},{n:'Fable 5.1',c:'#b79bff'},{n:'Opus 5.5',c:'#ffb85c'},{n:'Claude Code',c:null}];
const ROWY=[203,356,511,665];
function glassCursor(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.shadowColor='rgba(255,200,140,.9)';ctx.shadowBlur=18;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,34);ctx.lineTo(9,26);ctx.lineTo(15,40);ctx.lineTo(22,37);ctx.lineTo(16,24);ctx.lineTo(28,24);ctx.closePath();ctx.fillStyle='#fff';ctx.fill();ctx.restore()}
function S4(t){
  bgImg(IMGS.b_chat,t,4.8,1.02,1.1,18,-8,0.22);
  const CK='chat_glass',MK='menu_glass';
  const wp=eBack(prog(t,0,0.55)),csc=0.74*lerp(0.9,1,clamp(wp,0,1.04)),ccx=430,ccy=410+(1-clamp(wp,0,1))*40;
  const chipOpus=t>2.45,flip=t>2.35&&t<2.6?Math.abs(Math.cos((t-2.35)/0.25*Math.PI)):1;
  gAsset(CK,ccx,ccy,csc,()=>{

const BOUNDS=[0,2.6,6.0,8.6,11.2,16.0,19.8,23.0];
const NAMES=['01 — SPARK','02 — CLAUDE CODE','03 — THINKING','04 — REASONING','05 — CHAT','06 — BENCHMARK','07 — PROFILE'];
const LIGHT=[true,false,false,false,false,false,true];
const SCENES=[t=>S1(t*1.231),t=>S2(t*1.353),S3,S3b,S4,S5,S7];
function hud(t,si){
  if(si===6)return;
  const c=LIGHT[si]?'rgba(20,17,15,.8)':'rgba(243,238,230,.8)';ctx.strokeStyle=c;ctx.lineWidth=2;const m=24,L=20;
  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,sx,sy])=>{ctx.beginPath();ctx.moveTo(x,y+sy*L);ctx.lineTo(x,y);ctx.lineTo(x+sx*L,y);ctx.stroke()});
  if(WM)text("ST  /  CLAUDE REEL 2026",m+14,m+22,'500 11px '+MONO,c,'left');
  const f=Math.floor(t*FPS),tc=[Math.floor(f/FPS/60),Math.floor(f/FPS)%60,f%FPS].map(v=>String(v).padStart(2,'0')).join(':');
  text('TC 00:'+tc,W-m-14,m+22,'500 11px '+MONO,c,'right');text(NAMES[si],m+14,H-m-14,'500 11px '+MONO,c,'left');text('1280×720 · '+FPS+' FPS',W-m-14,H-m-14,'500 11px '+MONO,c,'right');
}
function stairs(t){const N=8,bh=H/N;for(let b=1;b<BOUNDS.length-1;b++){const B=BOUNDS[b];if(t>B-0.28&&t<B+0.28){for(let i=0;i<N;i++){let w;if(t<B)w=W*eIO(clamp((t-(B-0.28)-i*0.015)/0.2));else w=W*(1-eIO(clamp((t-B-i*0.015)/0.2)));ctx.fillStyle='#050505';if(t<B)ctx.fillRect(0,i*bh,w,bh+1);else ctx.fillRect(W-w,i*bh,w,bh+1)}}}}

// ---------- finishing layers (colour grade + vignette + film grain), per skill rules ----------
function finish(t,si){
  if(si===6)return;
  // gentle colour grade: warm highlights
  ctx.globalCompositeOperation='soft-light';ctx.fillStyle=LIGHT[si]?'rgba(255,190,150,.10)':'rgba(255,140,90,.10)';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
  // vignette
  const v=ctx.createRadialGradient(W/2,H/2,H*0.42,W/2,H/2,W*0.72);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,LIGHT[si]?'rgba(60,40,20,0.16)':'rgba(0,0,0,0.42)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  if(!LIGHT[si]){
    ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=0.16;ctx.filter='blur(14px) brightness(1.15)';ctx.drawImage(cv,0,0);ctx.restore();ctx.filter='none';
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(let i=0;i<2;i++){const x=W*(0.25+0.45*i)+Math.sin(t*0.35+i*2)*80,g=ctx.createLinearGradient(x,0,x+260,H);g.addColorStop(0,'rgba(255,255,255,.035)');g.addColorStop(1,'rgba(255,170,110,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-40,0);ctx.lineTo(x+120,0);ctx.lineTo(x+420,H);ctx.lineTo(x+120,H);ctx.closePath();ctx.fill()}
    ctx.restore();
  }
  // film grain (deterministic per frame)
  let seed=Math.floor(t*FPS)*9301+49297;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  ctx.fillStyle=LIGHT[si]?'rgba(20,17,15,.10)':'rgba(255,255,255,.07)';
  for(let i=0;i<2600;i++)ctx.fillRect(rnd()*W,rnd()*H,1.4,1.4);
}
const TW=0.35,CAM=[[1,1.06],[1.045,1],[1.05,1],[1.05,1],[1,1],[1,1.03],[1,1]];
function reset(c){c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c.filter='none'}
function drawScene(i,t){
  const lt=t-BOUNDS[i],dur=BOUNDS[i+1]-BOUNDS[i],z=lerp(CAM[i][0],CAM[i][1],eIO(clamp(lt/dur)));
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);SCENES[i](Math.max(0,lt));ctx.restore();
}
window.draw=function(t){
  ctx=ctxMain;reset(ctx);
  let si=0;for(let i=0;i<BOUNDS.length-1;i++)if(t>=BOUNDS[i])si=i;
  let b=-1;for(let j=1;j<BOUNDS.length-1;j++)if(Math.abs(t-BOUNDS[j])<TW)b=j;
  if(b<0){drawScene(si,t);finish(t,si);hud(t,si);return}
  const p=clamp((t-(BOUNDS[b]-TW))/(2*TW)),e=eIO(p);
  ctx=xA;reset(ctx);drawScene(b-1,t);ctx=xB;reset(ctx);drawScene(b,t);ctx=ctxMain;
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(1+0.10*e,1+0.10*e);ctx.translate(-W/2,-H/2);ctx.filter='blur('+(e*10).toFixed(1)+'px)';ctx.drawImage(cA,0,0);ctx.restore();ctx.filter='none';
  ctx.save();ctx.globalAlpha=e;ctx.translate(W/2,H/2);ctx.scale(1.08-0.08*e,1.08-0.08*e);ctx.translate(-W/2,-H/2);ctx.filter='blur('+((1-e)*10).toFixed(1)+'px)';ctx.drawImage(cB,0,0);ctx.restore();ctx.filter='none';ctx.globalAlpha=1;
  const lk=Math.sin(p*Math.PI),g=ctx.createRadialGradient(W*0.7,H*0.3,0,W*0.7,H*0.3,520);g.addColorStop(0,'rgba(255,150,90,'+(0.30*lk).toFixed(3)+')');g.addColorStop(1,'rgba(255,150,90,0)');
  ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
  const dom=e<0.5?b-1:b;finish(t,dom);hud(t,dom);
};
window.DUR=DUR;draw(0);
</script></body></html>
