<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
const W=1280,H=720,DUR=23,FPS=60;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SANS='Inter, "Liberation Sans", sans-serif',MONO='"DejaVu Sans Mono","Liberation Mono",monospace';
const PAPER='#f3eee6',INK='#14110f',ORANGE='#e8825a',YEL='#ffd45c',MINT='#9be7c4',LAV='#c9b8ff',PINK='#ffb199',SKY='#a8d8ff',CHAR='#161211',BLUE='#2f6bff';
const QP=new URLSearchParams(location.search);const WM=QP.get('wm')!=='0',SAMPLE=QP.get('sample')!=='0';
const BB={"profile_l": [192, 75, 976, 605, 1344, 752], "profile_d": [197, 72, 962, 604, 1344, 752], "chat_l": [312, 52, 744, 632, 1344, 752], "chat_d": [312, 50, 736, 622, 1344, 752], "menu_l": [205, 110, 781, 664, 1168, 880], "menu_d": [202, 107, 769, 643, 1168, 880], "term_l": [246, 49, 876, 652, 1344, 752], "term_d": [239, 40, 884, 648, 1344, 752], "stats_l": [241, 63, 873, 610, 1344, 752], "stats_d": [247, 58, 871, 604, 1344, 752], "think_nb": [75, 90, 875, 874, 1024, 1024], "stack_nb": [179, 79, 700, 882, 1024, 1024]};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),prog=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,x)=>a+(b-a)*x;
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,eO=x=>1-Math.pow(1-x,3),eO5=x=>1-Math.pow(1-x,5);
const eBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function tx(s,x,y,size,col,wt,al,a,fam){ctx.globalAlpha=a==null?1:a;ctx.font=(wt||800)+' '+size+'px '+(fam||SANS);ctx.fillStyle=col;ctx.textAlign=al||'left';ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);ctx.globalAlpha=1}
// ---------- assets ----------
const IMGS={};
function loadImg(src){return new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src})}
window.ready=(async()=>{
  IMGS.pet=await loadImg('hf/pet_cut.png');IMGS.sp=await loadImg('hf/spark.png');IMGS.avatar=await loadImg('hf/avatar.jpg');
  for(const k of Object.keys(BB))IMGS[k]=await loadImg('hf/'+k+'.png');
})();
function drawAsset(key,cx,cy,sc,fn,alpha){
  const im=IMGS[key],b=BB[key];if(!im||!b)return;
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(-(b[0]+b[2]/2),-(b[1]+b[3]/2));ctx.drawImage(im,0,0);if(fn)fn();ctx.restore();
}
// ---------- neo-brutalist building blocks ----------
function hardShadow(m){return m==='d'?'#000':INK}
function outline(m){return m==='d'?PAPER:INK}
function shape(kind,x,y,r,fill,m,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  for(const pass of [0,1]){
    ctx.save();if(pass===0)ctx.translate(9,9);
    ctx.beginPath();
    if(kind==='circle')ctx.arc(0,0,r,0,6.283);
    else if(kind==='square'){rr(-r,-r,r*2,r*2,r*0.25)}
    else {ctx.moveTo(0,-r);ctx.lineTo(r*1.05,r*0.8);ctx.lineTo(-r*1.05,r*0.8);ctx.closePath()}
    if(pass===0){ctx.fillStyle=hardShadow(m);ctx.fill()}else{ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=outline(m);ctx.lineJoin='round';ctx.stroke()}
    ctx.restore();
  }
  ctx.restore();
}
const TICK='CLAUDE  •  CODE  •  THINKING  •  REASONING  •  ';
function nbBG(t,m,base){
  const dark=m==='d';
  ctx.fillStyle=dark?CHAR:base;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=dark?'rgba(243,238,230,.10)':'rgba(20,17,15,.13)';
  const off=(t*16)%34;for(let x=-34+off;x<W;x+=34)for(let y=-34+off;y<H;y+=34){ctx.beginPath();ctx.arc(x,y,2.3,0,6.283);ctx.fill()}
  shape('circle',W*0.085,H*0.34+Math.sin(t*0.9)*14,44,ORANGE,m,0);
  shape('square',W*0.925,H*0.27+Math.sin(t*0.7+1)*14,38,dark?YEL:SKY,m,t*0.35);
  shape('tri',W*0.915,H*0.70+Math.sin(t*0.8+2)*12,44,MINT,m,-t*0.3);
  shape('square',W*0.075,H*0.70+Math.sin(t*0.6+3)*12,30,YEL,m,-t*0.4+0.4);
  // marquee strip along the bottom
  ctx.fillStyle=dark?'#000':INK;ctx.fillRect(0,H-46,W,46);ctx.fillStyle=ORANGE;ctx.fillRect(0,H-50,W,4);
  ctx.font='800 20px '+SANS;const seg=ctx.measureText(TICK).width;const sx=-((t*90)%seg);
  ctx.fillStyle=PAPER;ctx.textAlign='left';ctx.textBaseline='alphabetic';for(let x=sx;x<W;x+=seg)ctx.fillText(TICK,x,H-16);
  if(WM){ctx.save();ctx.translate(W-86,H-76);ctx.rotate(-0.07);rr(-40,-14,80,28,8);ctx.fillStyle=YEL;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();tx('ST · 2026',0,5,14,INK,900,'center');ctx.restore()}
}
const TCOL=[ORANGE,YEL,MINT,LAV,'#ffffff',SKY];
function tiles(word,cx,cy,size,t,t0,st,m){
  const gap=size*0.12,ws=[...word].map(c=>c===' '?size*0.5:size);const total=ws.reduce((a,b)=>a+b,0)+gap*(word.length-1);let x=cx-total/2,ci=0;
  [...word].forEach((ch,i)=>{
    const w=ws[i],c=x+w/2;x+=w+gap;if(ch===' ')return;
    const p=prog(t,t0+i*st,t0+i*st+0.6);if(p<=0){ci++;return}
    const e=eBack(p),yo=(1-eO5(p))*-420,rot=(1-eO(p))*(i%2?0.7:-0.7),s=lerp(0.55,1,clamp(e,0,1.12));
    ctx.save();ctx.translate(c,cy+yo);ctx.rotate(rot);ctx.scale(s,s);ctx.globalAlpha=clamp(p*4);
    rr(-size/2+size*0.09,-size/2+size*0.09,size,size,size*0.16);ctx.fillStyle=hardShadow(m);ctx.fill();
    rr(-size/2,-size/2,size,size,size*0.16);ctx.fillStyle=TCOL[ci%TCOL.length];ctx.fill();ctx.lineWidth=Math.max(4,size*0.06);ctx.strokeStyle=outline(m);ctx.stroke();
    ctx.font='900 '+Math.round(size*0.64)+'px '+SANS;ctx.fillStyle=INK;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,0,size*0.04);
    ctx.restore();ci++;
  });
}
// light -> dark switch with a hard-edged wipe
function dual(t,t1,t2,fn){
  const p=eIO(prog(t,t1,t2));
  if(p<=0){fn('l');return 0}
  if(p>=1){fn('d');return 1}
  fn('l');const x=lerp(-160,W+160,p);
  ctx.save();ctx.beginPath();ctx.moveTo(-10,-10);ctx.lineTo(x+110,-10);ctx.lineTo(x-110,H+10);ctx.lineTo(-10,H+10);ctx.closePath();ctx.clip();fn('d');ctx.restore();
  ctx.save();ctx.strokeStyle=INK;ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(x+110,-10);ctx.lineTo(x-110,H+10);ctx.stroke();ctx.strokeStyle=ORANGE;ctx.lineWidth=5;ctx.stroke();ctx.restore();
  return p;
}
function toggleSw(p,a){
  const x=W-150,y=36,w=96,h=44;ctx.save();ctx.translate(x,y);ctx.globalAlpha=a==null?1:a;
  rr(7,7,w,h,h/2);ctx.fillStyle='#000';ctx.fill();
  rr(0,0,w,h,h/2);ctx.fillStyle=p<0.5?YEL:'#2a2522';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=p<0.5?INK:PAPER;ctx.stroke();
  const kx=lerp(h/2,w-h/2,eIO(p));ctx.beginPath();ctx.arc(kx,h/2,h/2-8,0,6.283);ctx.fillStyle=p<0.5?'#fff':PAPER;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();
  ctx.strokeStyle=INK;ctx.lineWidth=3;
  if(p<0.5){for(let i=0;i<8;i++){const a2=i/8*6.283;ctx.beginPath();ctx.moveTo(kx+Math.cos(a2)*7,h/2+Math.sin(a2)*7);ctx.lineTo(kx+Math.cos(a2)*11,h/2+Math.sin(a2)*11);ctx.stroke()}ctx.beginPath();ctx.arc(kx,h/2,4,0,6.283);ctx.stroke()}
  else{ctx.beginPath();ctx.arc(kx,h/2,8,0.5,5.8);ctx.stroke()}
  ctx.restore();
}
// ---------- the pet (Higgsfield 3D) ----------
function pet(x,y,s,t,walk){
  const im=IMGS.pet;if(!im)return;const ph=t*9*walk,bob=Math.abs(Math.sin(ph))*-9*walk,sway=Math.sin(ph)*0.07*walk,sq=1+Math.abs(Math.sin(ph))*0.045*walk,h=118*s,w=h*im.width/im.height;
  ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(0,2,w*0.36,8,0,0,6.283);ctx.fill();ctx.translate(0,bob);ctx.rotate(sway);ctx.scale(1,sq);ctx.drawImage(im,-w/2,-h,w,h);ctx.restore();
}
// ================= SCENES =================
function S1(t){ // CLAUDE
  nbBG(t,'l',YEL);
  const k=prog(t,0.1,0.95),e=eBack(k),sz=330*clamp(e,0,1.08),fy=Math.sin(t*1.8)*8*eO(k);
  if(IMGS.sp&&k>0){ctx.save();ctx.translate(W/2,300+fy);ctx.rotate((1-eO5(k))*-2.4+Math.sin(t*1.4)*0.04);
    ctx.filter='brightness(0)';ctx.drawImage(IMGS.sp,-sz/2+16,-sz/2+16,sz,sz);ctx.filter='none';ctx.drawImage(IMGS.sp,-sz/2,-sz/2,sz,sz);ctx.restore()}
  tiles('CLAUDE',W/2,566,104,t,0.9,0.07,'l');
}
function S2draw(t,m){ // CLAUDE CODE
  nbBG(t,m,MINT);
  tiles('CLAUDE CODE',W/2,88,64,t,0.1,0.05,m);
  const pop=eBack(prog(t,0.25,0.8)),cx=W/2,cy=418,sc=0.60*lerp(0.88,1,clamp(pop,0,1.05));
  drawAsset('term_'+m,cx,cy,sc,()=>{
    ctx.fillStyle=m==='d'?'#0b0706':'#14110f';rr(285,196,785,430,14);ctx.fill();
    tx('claude-code',745,127,34,INK,900,'center',eO(prog(t,0.3,0.6)));
    const F=36,L=[262,336,410,484,558];
    tx('> claude',310,L[0],F,PAPER,700,'left',eO(prog(t,0.45,0.7)),MONO);
    tx('* Welcome to Claude Code',310,L[1],F,ORANGE,700,'left',eO(prog(t,0.75,1.0)),MONO);
    const cmd='> Build me a landing page',n=Math.floor(prog(t,1.0,1.8)*cmd.length);
    tx(cmd.slice(0,n)+((Math.floor(t*3)%2===0&&t<2.0)?'_':''),310,L[2],F,PAPER,700,'left',eO(prog(t,0.95,1.1)),MONO);
    tx('● Writing index.html',310,L[3],F,PAPER,700,'left',eO(prog(t,2.0,2.3)),MONO);
    tx('v Done. Preview is ready.',310,L[4],F,'#7ddc8a',700,'left',eO(prog(t,2.45,2.75)),MONO);
  });
  const wy=cy+(52-376)*sc*1.0,pp=prog(t,0.9,3.2),px=lerp(cx-sc*440+80,cx+sc*440-80,eIO(pp));
  if(t>0.9)pet(px,wy+6,0.74,t,pp>0&&pp<1?1:0);
}
function S2(t){const p=dual(t,2.0,2.55,m=>S2draw(t,m));toggleSw(p,eO(prog(t,0.2,0.5)))}
function S3(t){ // THINKING (dark)
  nbBG(t,'d',LAV);
  const pop=eBack(prog(t,0.1,0.7)),sc=0.52*clamp(pop,0,1.06)*(1+Math.sin(t*3)*0.012);
  drawAsset('think_nb',W/2,296+Math.sin(t*2)*10,sc,null,clamp(pop*3));
  [[-300,-30,0.4],[300,-70,0.55],[260,150,0.7]].forEach(([dx,dy,d],i)=>{const a=eBack(prog(t,d,d+0.5));shape(i%2?'square':'circle',W/2+dx,300+dy+Math.sin(t*2+i)*8,22*clamp(a,0,1),[YEL,ORANGE,MINT][i],'d',t*0.6*(i?1:-1))});
  tiles('THINKING',W/2,570,92,t,0.7,0.06,'d');
}
function S4(t){ // REASONING (light)
  nbBG(t,'l',PINK);
  const pop=eBack(prog(t,0.1,0.7)),sc=0.46*clamp(pop,0,1.06);
  drawAsset('stack_nb',W/2-170,300+Math.sin(t*1.8)*8,sc,null,clamp(pop*3));
  [['READ',YEL,-0.05],['WEIGH',ORANGE,0.04],['CHECK',MINT,-0.03]].forEach(([l,c,r],i)=>{
    const p=eBack(prog(t,0.7+i*0.3,1.1+i*0.3));if(p<=0)return;const x=W/2+190,y=205+i*100;
    ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.scale(clamp(p,0,1.08),clamp(p,0,1.08));
    rr(8,8,230,66,14);ctx.fillStyle=INK;ctx.fill();rr(0,0,230,66,14);ctx.fillStyle=c;ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.stroke();
    ctx.beginPath();ctx.arc(34,33,14,0,6.283);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=4;ctx.stroke();ctx.beginPath();ctx.moveTo(27,33);ctx.lineTo(32,39);ctx.lineTo(42,26);ctx.stroke();
    tx(l,66,46,32,INK,900);ctx.restore()});
  tiles('REASONING',W/2,570,84,t,0.6,0.06,'l');
}
// --- chat window with the model picker ---
function cursor(x,y,s,m){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,38);ctx.lineTo(10,29);ctx.lineTo(17,44);ctx.lineTo(25,40);ctx.lineTo(18,26);ctx.lineTo(31,26);ctx.closePath();ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=4.5;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.stroke();ctx.restore()}
function S5draw(t,m){
  nbBG(t,m,SKY);
  tiles('CHAT',W/2,64,58,t,0.1,0.07,m);
  const fg=m==='d'?PAPER:INK,boxBg=m==='d'?'#1d1a18':'#f4f4f4';
  const win=eBack(prog(t,0.0,0.5)),csc=0.70*lerp(0.9,1,clamp(win,0,1.04)),ccx=410,ccy=410;
  const chipOpus=t>1.35;const flip=Math.abs(Math.cos(clamp((t-1.3)/0.25,0,1)*Math.PI));
  drawAsset('chat_'+m,ccx,ccy,csc,()=>{
    tx('claude.ai',700,118,34,fg,900,'center');
    // messages
    const ub=eBack(prog(t,3.1,3.5));if(ub>0){ctx.save();ctx.translate(1010,235);ctx.scale(clamp(ub,0,1.05),clamp(ub,0,1.05));rr(-436,-52,444,104,26);ctx.fillStyle=INK;ctx.fill();rr(-446,-62,444,104,26);ctx.fillStyle=ORANGE;ctx.fill();ctx.lineWidth=7;ctx.strokeStyle=INK;ctx.stroke();tx('Make an intro for Claude Code',-224,10,25,INK,800,'center');ctx.restore()}
    const bb=eBack(prog(t,3.5,3.9));if(bb>0){ctx.save();ctx.translate(345,365);ctx.scale(clamp(bb,0,1.05),clamp(bb,0,1.05));rr(8,8,420,104,26);ctx.fillStyle=INK;ctx.fill();rr(0,0,420,104,26);ctx.fillStyle=YEL;ctx.fill();ctx.lineWidth=7;ctx.strokeStyle=INK;ctx.stroke();tx('Opus 5.5 is on it.',210,63,32,INK,800,'center');ctx.restore()}
    // input row: patch the pill, then the live selector chip
    ctx.fillStyle=boxBg;rr(712,533,196,66,30);ctx.fill();
    const typed='Make an intro for Claude Code',n=Math.floor(prog(t,2.0,2.9)*typed.length);
    const sent=t>3.0;
    tx(sent?'Message…':(n>0?typed.slice(0,n)+((Math.floor(t*3)%2===0)?'|':''):'Message…'),378,585,32,(n>0&&!sent)?fg:(m==='d'?'#8b847d':'#9a9a9a'),700);
    ctx.save();ctx.translate(808,566);ctx.scale(1,t>1.3&&t<1.55?Math.max(0.05,flip):1);rr(-84+5,-26+5,172,52,26);ctx.fillStyle=INK;ctx.fill();rr(-84,-26,172,52,26);ctx.fillStyle=chipOpus?ORANGE:YEL;ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=INK;ctx.stroke();tx(chipOpus?'Opus 5.5':'Sonnet 5.5',-6,8,23,INK,900,'center');ctx.beginPath();ctx.moveTo(52,-5);ctx.lineTo(60,5);ctx.lineTo(68,-5);ctx.lineWidth=4;ctx.stroke();ctx.restore();
    const sp=t>2.95&&t<3.3?1+0.18*Math.sin((t-2.95)*18.8):1;ctx.beginPath();ctx.arc(943,565,36*sp,0,6.283);ctx.fillStyle=ORANGE;ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.stroke();ctx.beginPath();ctx.moveTo(943,582);ctx.lineTo(943,548);ctx.moveTo(928,562);ctx.lineTo(943,548);ctx.lineTo(958,562);ctx.lineWidth=7;ctx.lineCap='round';ctx.stroke();
  },1);
  // dropdown menu (opens, Opus gets picked, closes)
  const mp=eBack(prog(t,0.35,0.85))*(1-eIO(prog(t,1.7,2.0)));
  if(mp>0.02){
    const msc=0.50*clamp(mp,0,1.05);
    drawAsset('menu_'+m,980,408,msc,()=>{
      const mfg=m==='d'?PAPER:INK;
      tx('Sonnet 5.5',420,258,46,mfg,900);tx('Opus 5.5',420,446,46,INK,900);tx('Claude Code',420,630,46,mfg,900);
      if(IMGS.sp)ctx.drawImage(IMGS.sp,285,566,88,88);
      ctx.beginPath();ctx.arc(827,425,52,0,6.283);ctx.fillStyle=ORANGE;ctx.fill();
      const ck=eBack(prog(t,1.25,1.55));if(ck>0){ctx.save();ctx.translate(827,425);ctx.scale(clamp(ck,0,1.1),clamp(ck,0,1.1));ctx.beginPath();ctx.arc(0,0,44,0,6.283);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=9;ctx.strokeStyle=INK;ctx.stroke();ctx.beginPath();ctx.moveTo(-18,2);ctx.lineTo(-5,17);ctx.lineTo(20,-16);ctx.lineWidth=11;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();ctx.restore()}
    },clamp(mp*2));
  }
  // cursor travels to the Opus row and clicks
  const cp=eIO(prog(t,0.8,1.2));
  if(t>0.7&&t<2.0){const cx0=lerp(1130,1000,cp),cy0=lerp(560,410,cp)*1;cursor(cx0,cy0,0.9,m);const rp=prog(t,1.2,1.6);if(rp>0&&rp<1){ctx.strokeStyle=fg;ctx.lineWidth=5;ctx.globalAlpha=1-rp;ctx.beginPath();ctx.arc(cx0,cy0,10+rp*46,0,6.283);ctx.stroke();ctx.globalAlpha=1}}
}
function S5(t){const p=dual(t,3.7,4.25,m=>S5draw(t,m));toggleSw(p,eO(prog(t,0.2,0.5)))}
// --- benchmark card ---
const STATS=[{n:'PRO',o:89.9,s:81.3},{n:'MULTILINGUAL',o:93.9,s:90.3},{n:'MULTIMODAL',o:61.4,s:54.3}];
function S6draw(t,m){
  nbBG(t,m,LAV);
  const win=eBack(prog(t,0.0,0.5)),sc=0.88*lerp(0.9,1,clamp(win,0,1.04));
  drawAsset('stats_'+m,W/2,372,sc,()=>{
    tx('Where Opus 5.5 leads.',300,152,52,INK,900);tx('SWE-BENCH',1050,150,26,INK,900,'right',0.75);
    STATS.forEach((r,i)=>{
      const cy=[279,403,525][i],s0=0.5+i*0.35,po=eO5(prog(t,s0,s0+0.9)),ps=eO5(prog(t,s0+0.15,s0+1.05)),x0=322,full=574;
      const wo=full*r.o/100*po,wsn=full*r.s/100*ps;
      ctx.save();rr(x0-6,cy-34,full+10,68,30);ctx.clip();
      ctx.fillStyle=ORANGE;ctx.fillRect(x0-6,cy-34,wo+6,68);ctx.fillStyle='#fff';ctx.fillRect(x0-6,cy-34,wsn+6,68);
      ctx.fillStyle=INK;if(wsn>10)ctx.fillRect(x0+wsn-3,cy-34,6,68);ctx.restore();
      tx(r.n,x0+18,cy+11,30,INK,900,'left',clamp(po*3));
      tx((r.o*po).toFixed(1),Math.max(x0+160,x0+wo-14),cy-40,32,INK,900,'right',clamp(po*2));
      tx('Sonnet '+(r.s*ps).toFixed(1),x0+full,cy+58,22,m==='d'?PAPER:INK,800,'right',clamp(ps*2));
      const bp=eBack(prog(t,s0+0.7,s0+1.1));if(bp>0){ctx.save();ctx.translate(980,cy);ctx.scale(clamp(bp,0,1.1),clamp(bp,0,1.1));ctx.beginPath();ctx.arc(0,0,44,0,6.283);ctx.fillStyle=BLUE;ctx.fill();ctx.lineWidth=7;ctx.strokeStyle=INK;ctx.stroke();tx('+'+(r.o-r.s).toFixed(1),0,9,26,'#fff',900,'center');ctx.restore()}
    });
  });
  tx('Vendor-reported via third-party summaries · verify with the system card',W/2,H-62,13,m==='d'?PAPER:INK,700,'center',0.8,MONO);
}
function S6(t){const p=dual(t,2.2,2.75,m=>S6draw(t,m));toggleSw(p,eO(prog(t,0.2,0.5)))}
// --- profile card ---
function S7draw(t,m){
  nbBG(t,m,YEL);
  const win=eBack(prog(t,0.0,0.5)),sc=0.82*lerp(0.9,1,clamp(win,0,1.04));
  drawAsset('profile_'+m,W/2,372,sc,()=>{
    const ar=eBack(prog(t,0.35,0.9));
    if(ar>0){const r=66*clamp(ar,0,1.08);ctx.save();ctx.beginPath();ctx.arc(330,200,r,0,6.283);ctx.clip();if(IMGS.avatar)ctx.drawImage(IMGS.avatar,330-r,200-r,r*2,r*2);ctx.restore();ctx.lineWidth=8;ctx.strokeStyle=INK;ctx.beginPath();ctx.arc(330,200,r,0,6.283);ctx.stroke()}
    const rise=(t0,fn)=>{const a=eO(prog(t,t0,t0+0.4));if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.translate(0,(1-a)*14);fn();ctx.restore()};
    rise(0.7,()=>{tx('PROFILE',490,189,18,INK,900);tx('Karinas',490,243,50,INK,900)});

    rise(1.0,()=>{tx('NAME',360,324,16,'#555',900);tx('Diameter',360,368,38,INK,900);tx('REGION',720,324,16,'#555',900);tx('United States',720,368,38,INK,900)});
    rise(1.35,()=>{tx('PLAN',360,426,16,'#555',900);ctx.fillStyle=INK;rr(349,441,216,50,25);ctx.fill();ctx.fillStyle=ORANGE;rr(343,435,216,50,25);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=INK;ctx.stroke();tx('Max plan',451,471,30,INK,900,'center');tx('BILLING',720,426,16,'#555',900);tx('$100/month',720,474,38,INK,900)});
    rise(1.7,()=>{tx('EMAIL',360,532,16,'#555',900);tx('karinawitme12@gmail.com',360,578,38,INK,900)});
  });
  if(SAMPLE)tx('Sample profile · demo data',W/2,H-62,13,m==='d'?PAPER:INK,700,'center',0.75,MONO);
}
function S7(t){const p=dual(t,2.55,3.1,m=>S7draw(t,m));toggleSw(p,eO(prog(t,0.2,0.5)))}

// ---------- timeline ----------
const BOUNDS=[0,2.6,6.0,8.6,11.2,16.0,19.2,23.0];
const CAM=[[1,1.04],[1,1.02],[1.04,1],[1,1.04],[1,1],[1,1],[1,1]];
const SCENES=[S1,S2,S3,S4,S5,S6,S7];
function wipes(t){
  const cols=[YEL,ORANGE,MINT,INK];
  for(let b=1;b<BOUNDS.length-1;b++){const B=BOUNDS[b];if(Math.abs(t-B)>=0.34)continue;
    const cover=t<B?eIO(prog(t,B-0.34,B)):1-eIO(prog(t,B,B+0.34));
    for(let i=0;i<4;i++){const c=eIO(clamp(cover*1.5-i*0.14)),w=W*c;if(w<1)continue;const y=i*H/4;
      ctx.fillStyle=cols[i];if(t<B){ctx.fillRect(0,y,w,H/4+1);ctx.fillStyle=INK;ctx.fillRect(w-8,y,8,H/4+1)}else{ctx.fillRect(W-w,y,w,H/4+1);ctx.fillStyle=INK;ctx.fillRect(W-w,y,8,H/4+1)}
      ctx.fillStyle=INK;ctx.fillRect(0,y,W,3)}}
}
window.draw=function(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.filter='none';
  let si=0;for(let i=0;i<BOUNDS.length-1;i++)if(t>=BOUNDS[i])si=i;
  const lt=t-BOUNDS[si],dur=BOUNDS[si+1]-BOUNDS[si],z=lerp(CAM[si][0],CAM[si][1],eIO(clamp(lt/dur)));
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);SCENES[si](lt);ctx.restore();
  wipes(t);
};
window.DUR=DUR;
